server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: firewalla_syslog
    syslog:
      listen_address: 0.0.0.0:514
      listen_protocol: udp
      idle_timeout: 60s
      label_structured_data: true
      labels:
        job: firewalla
    relabel_configs:
      # promote hostname from syslog to a label
      - source_labels: [__syslog_message_hostname]
        target_label: host
      # promote severity
      - source_labels: [__syslog_message_severity]
        target_label: severity
      # promote app-name (firewall component)
      - source_labels: [__syslog_message_app_name]
        target_label: app
